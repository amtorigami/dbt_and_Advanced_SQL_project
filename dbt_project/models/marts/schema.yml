version: 2

models:
  - name: dim_vehicle
    description: "Dimension véhicule (SCD type 1)"
    columns:
      - name: vehicle_id
        data_tests: [unique, not_null]
      - name: vehicle_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['economy', 'comfort', 'xl']
  - name: dim_zone
    description: "Dimension zone (SCD type 1)"
    columns:
      - name: zone_id
        data_tests: [unique, not_null]
  - name: fact_rides
    description: "Une ligne par course, incrémentale"
    columns:
      - name: ride_id
        data_tests: [unique, not_null]
      - name: driver_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_drivers')
                field: driver_id
      - name: pickup_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
      - name: dropoff_zone_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_id
  - name: fct_driver_daily_earnings
    description: "Gains par chauffeur et par jour, avec cumul et rang quotidien"
    columns:
      - name: driver_id
        data_tests: [not_null]
      - name: ride_date
        data_tests: [not_null]
